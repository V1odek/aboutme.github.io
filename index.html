<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wojciech Nikiel - Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F3F4F6; /* Delikatnie szare tło strony, aby karty zyskały głębię */
      --surface: #FFFFFF; /* Czysta biel kart */
      --text-main: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --accent: #2563EB;
      --accent-light: #EFF6FF;
      
      --ff-sans: 'Outfit', sans-serif;
      --ff-mono: 'JetBrains Mono', monospace;
      
      --radius: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--ff-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 2rem 1rem;
    }

    /* ── LAYOUT GŁÓWNY ── */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── KARTY BENTO (Wspólne style) ── */
    .bento-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 2.5rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
      transition: var(--transition);
    }
    .bento-card:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      border-color: #D1D5DB;
    }

    /* ── UKŁAD SIATKI (BENTO GRID) ── */
    .grid-hero {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    .grid-about {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 1.5rem;
    }
    .grid-skills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    /* ── HERO SEKCJA ── */
    .hero-text h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .hero-text h2 {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 2rem;
    }
    .social-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.5rem;
      border-radius: 99px;
      font-family: var(--ff-mono);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: var(--transition);
    }
    .btn-primary {
      background: var(--text-main);
      color: white;
    }
    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      background: var(--bg);
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    /* ── ZDJĘCIE & RYMOWANKA ── */
    .photo-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: url('photo.jpg') center/cover no-repeat;
      min-height: 250px;
    }
    /* Jeśli brak zdjęcia, zróbmy ładny gradient */
    .photo-card.no-bg {
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    }

    .rhyme-card {
      background: var(--accent-light);
      border-color: #BFDBFE;
      position: relative;
      overflow: hidden;
    }
    .rhyme-card::before {
      content: '"';
      position: absolute;
      top: -20px;
      right: 20px;
      font-size: 8rem;
      font-family: serif;
      color: #DBEAFE;
      line-height: 1;
      z-index: 0;
    }
    .rhyme-card p {
      position: relative;
      z-index: 1;
      font-size: 1.1rem;
      font-style: italic;
      color: #1E3A8A;
      line-height: 1.7;
    }

    /* ── SEKCJA O MNIE I DOŚWIADCZENIE ── */
    .section-label {
      font-family: var(--ff-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 1.5rem;
      display: block;
      font-weight: 700;
    }
    
    .about-list p { margin-bottom: 1rem; color: var(--text-muted); }
    .about-list strong { color: var(--text-main); font-weight: 600; }
    
    .exp-item {
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .exp-item:last-child { border: none; margin: 0; padding: 0; }
    
    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    .exp-title { font-weight: 600; font-size: 1.1rem; }
    .exp-date { font-family: var(--ff-mono); font-size: 0.75rem; color: var(--text-muted); }
    .exp-desc { font-size: 0.95rem; color: var(--text-muted); }
    
    .badge {
      display: inline-block;
      background: #FEF3C7;
      color: #92400E;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      margin-top: 0.5rem;
    }

    /* ── UMIEJĘTNOŚCI ── */
    .skill-group h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .tag {
      font-family: var(--ff-mono);
      font-size: 0.75rem;
      padding: 0.4rem 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
    }

    /* ── STOPKA ── */
    footer {
      text-align: center;
      padding: 2rem 0;
      font-family: var(--ff-mono);
      font-size: 0
